<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود مدیر | SchoolHub</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Persian Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- Page CSS -->
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- Logo -->

        <div class="login-logo">

            <a href="../index.html">
                School<span>Hub</span>
            </a>

        </div>


        <!-- Icon -->

        <div class="login-icon">

            <i class="fa-solid fa-user-tie"></i>

        </div>


        <!-- Title -->

        <h1>
            ورود مدیر مدرسه
        </h1>


        <p class="login-subtitle">
            برای ورود به پنل مدیریت، اطلاعات خود را وارد کنید.
        </p>


        <!-- Login Form -->

        <form action="dashboard.html" method="get">


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    نام کاربری
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="نام کاربری خود را وارد کنید"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور خود را وارد کنید"
                        required
                    >

                </div>

            </div>


            <!-- Submit -->

            <button type="submit" class="login-button">

                ورود به پنل مدیر

                <i class="fa-solid fa-arrow-left"></i>

            </button>

        </form>


        <!-- Back -->

        <a href="../admin/dashboard.html" class="back-link">

            <i class="fa-solid fa-arrow-right"></i>

            بازگشت به انتخاب پنل

        </a>

    </div>

</div>

</body>

</html>
